name: CI
on:
  push:
    branches: [main, trae/*]
  pull_request:
  workflow_dispatch:
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Import sanity
        run: |
          python -c "from tidetail.torch_diffusion import TemporalDenoiser, Diffusion; print('diffusion OK')"
          python -c "from tidetail.baselines import GRUForecaster, TCNForecaster; print('baselines OK')"
          python -c "from tidetail.augment import extreme_balance_weights; print('augment OK')"
      - name: Test
        run: pytest -q
